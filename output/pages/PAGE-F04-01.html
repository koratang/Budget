  .grid th.fz { z-index: 3; }
  .grid .fz-last { border-right: 1px solid var(--border); }
  .grid tr.blk td { border-top: 1px solid var(--border); }

<script>
/* ===== 公共：工具、轻提示、弹窗、原型状态 ===== */
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
function r2(x) { return Math.round((x + (x >= 0 ? 1 : -1) * 1e-9) * 100) / 100; }
function fmtNum(v, d) { return Number(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }); }
function fmtMoney(v) { return fmtNum(v, 2); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function nowTime() { const d = new Date(); return [d.getHours(), d.getMinutes(), d.getSeconds()].map(x => String(x).padStart(2, '0')).join(':'); }
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3000);
}
let _modal = null;
function openModal(html, onMount) {
  closeModal();
  const bd = document.createElement('div'); bd.className = 'modal-backdrop';
  bd.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' + html + '</div>';
  bd.addEventListener('click', e => { if (e.target === bd) closeModal(); });
  document.body.appendChild(bd); _modal = bd;
  $$('[data-close]', bd).forEach(b => b.addEventListener('click', closeModal));
  if (onMount) onMount(bd.firstChild);
  const f = $('input,select,textarea,button', bd.firstChild); if (f) f.focus();
  return bd.firstChild;
}
function closeModal() { if (_modal) { _modal.remove(); _modal = null; } }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && _modal) closeModal(); });

/* 原型状态切换：正常 / 空 / 加载 / 错误 / 无权限 */
function setupStates(cfg) {
  const normal = $('#v-normal'), st = $('#v-state');
  function show(s) {
    $$('.proto-bar [data-state]').forEach(b => b.setAttribute('aria-pressed', b.dataset.state === s ? 'true' : 'false'));
    if (s === 'normal') { normal.hidden = false; st.hidden = true; return; }
    normal.hidden = true; st.hidden = false;
    if (s === 'loading') {
      let rows = ''; for (let i = 0; i < 8; i++) rows += '<div class="skeleton" style="margin:14px 0;width:' + (60 + (i * 13) % 40) + '%"></div>';
      st.innerHTML = '<div class="card" aria-busy="true"><div class="kpi-label">' + esc(cfg.loading || '正在加载…') + '</div>' + rows + '</div>';
      return;
    }
    const c = cfg[s];
    st.innerHTML = '<div class="card"><div class="state"><div class="state-title">' + esc(c.title) + '</div><div>' + esc(c.desc) + '</div>' +
      (c.btn ? '<div style="margin-top:16px"><button class="btn ' + (c.primary ? 'btn-primary' : '') + '" type="button" id="state-btn">' + esc(c.btn) + '</button></div>' : '') + '</div></div>';
    const b = $('#state-btn'); if (b) b.addEventListener('click', () => { if (c.onClick) c.onClick(); else show('normal'); });
  }
  $$('.proto-bar [data-state]').forEach(b => b.addEventListener('click', () => show(b.dataset.state)));
  show('normal');
  return show;
}

const STATUS_BADGE = { '未开始': 'badge', '填报中': 'badge', '已提交': 'badge badge-info', '已退回': 'badge badge-bad', '已通过': 'badge badge-good' };

const ORDER = { '已退回': 0, '未开始': 1, '填报中': 2, '已提交': 3, '已通过': 4 };
function render(who) {
  $('.topbar .who').firstChild.textContent = '当前用户：' + WHO[who] + ' · ';
  const list = UNITS.filter(u => u[2] === who).sort((a, b) => ORDER[a[3]] - ORDER[b[3]]);

  $('#summary').textContent = '你负责 ' + list.length + ' 个填报单位，待处理 ' + todo.length + ' 个（未开始、填报中或已退回）。';
  $('#od-note').hidden = !todo.length;
  $('#od-note').innerHTML = '<span class="t">已过截止日期 2026-12-20</span> · 还有 ' + todo.length + ' 个单位未提交，请尽快完成。';
  $('#tb').innerHTML = list.map(u => {

  }).join('');
  $$('#tb a.btn').forEach(a => a.style.textDecoration = 'none');
}
